<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Coin Glow & Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="elevate" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGradient)"/>

  <!-- Subtle Inner Glow Border -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4"/>

  <!-- Main Graphic Container with Elevation -->
  <g filter="url(#elevate)">
    <!-- Intersecting Duo Rings representing mutual shared finance -->
    <circle cx="205" cy="225" r="95" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="20"/>
    <circle cx="307" cy="225" r="95" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="20"/>

    <!-- Left Partner Silhouette (You) -->
    <g fill="#FFFFFF">
      <circle cx="185" cy="180" r="42"/>
      <path d="M115 315 C115 255, 150 235, 185 235 C220 235, 245 255, 255 315 Z" fill-opacity="0.95"/>
    </g>

    <!-- Right Partner Silhouette (Partner) -->
    <g fill="#FFFFFF" fill-opacity="0.85">
      <circle cx="327" cy="180" r="42"/>
      <path d="M257 315 C267 255, 292 235, 327 235 C362 235, 397 255, 397 315 Z"/>
    </g>

    <!-- Split Arch / Balance Beam -->
    <path d="M150 345 Q 256 315 362 345" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Central Floating Rupee Coin with Gold Luster -->
    <g transform="translate(256, 345)">
      <!-- Outer coin shadow & rim -->
      <circle cx="0" cy="0" r="56" fill="url(#coinGrad)" stroke="#FFFFFF" stroke-width="6"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3"/>

      <!-- Embossed Rupee Symbol ₹ -->
      <text x="0" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Arial, sans-serif" font-size="56" font-weight="900" fill="#78350F" text-anchor="middle">₹</text>
    </g>

    <!-- Sparkle Stars for Polish -->
    <g fill="#FDE047" opacity="0.9">
      <!-- Top Left Sparkle -->
      <path d="M 115 125 Q 120 135 130 140 Q 120 145 115 155 Q 110 145 100 140 Q 110 135 115 125 Z"/>
      <!-- Top Right Sparkle -->
      <path d="M 395 110 Q 400 118 408 122 Q 400 126 395 134 Q 390 126 382 122 Q 390 118 395 110 Z"/>
    </g>
  </g>
</svg>
