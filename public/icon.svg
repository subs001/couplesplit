<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer wallet / ledger folder -->
  <g filter="url(#shadow)">
    <!-- Main receipt/card -->
    <rect x="96" y="110" width="320" height="290" rx="36" fill="#ffffff" />
    
    <!-- Header banner in card -->
    <path d="M 96 146 C 96 126 112 110 132 110 L 380 110 C 400 110 416 126 416 146 L 416 186 L 96 186 Z" fill="url(#cardGrad)" />
    
    <!-- Partner 1 & Partner 2 avatar dots / icons -->
    <circle cx="216" cy="148" r="18" fill="#ffffff" />
    <circle cx="296" cy="148" r="18" fill="#ffffff" opacity="0.9" />
    <path d="M 234 148 L 278 148" stroke="#ffffff" stroke-width="4" stroke-dasharray="4,4" />
    
    <!-- Currency / Split badge -->
    <circle cx="256" cy="245" r="42" fill="#10b981" opacity="0.12" />
    <text x="256" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#047857" text-anchor="middle">₹/$</text>
    
    <!-- Lines for transactions / categories -->
    <rect x="144" y="315" width="130" height="14" rx="7" fill="#e2e8f0" />
    <rect x="310" y="315" width="58" height="14" rx="7" fill="#10b981" />
    <rect x="144" y="345" width="160" height="14" rx="7" fill="#f1f5f9" />
    <rect x="324" y="345" width="44" height="14" rx="7" fill="#cbd5e1" />
  </g>

  <!-- Split arrows floating badge -->
  <g filter="url(#shadow)">
    <circle cx="395" cy="385" r="56" fill="#10b981" />
    <!-- 2 curved split arrows representing sharing expenses -->
    <path d="M 375 385 C 375 372 385 365 395 365 L 412 365 M 405 358 L 415 365 L 405 372" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 415 385 C 415 398 405 405 395 405 L 378 405 M 385 398 L 375 405 L 385 412" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
